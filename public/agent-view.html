<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent - Prompt Cockpit</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
<style>
  /* Page-specific chrome only - everything else (.msg, .tool-row, etc.)
     comes from style.css, shared with index.html so a subagent's own tool
     calls render identically here as they would in the main session. */
  body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
  #agentHeader {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #agentHeader strong { font-size: 14px; }
  #agentStatus { font-size: 12px; color: var(--muted); margin-left: auto; }
  #agentStream { flex: 1; overflow-y: auto; padding: 8px 14px; }
  .readonly-badge {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: var(--accent-dim, #33415580); color: var(--accent, #7aa2f7);
    border: 1px solid var(--accent, #7aa2f7);
  }
</style>
</head>
<body>
  <div id="agentHeader">
    <span class="readonly-badge">Read-only</span>
    <strong id="agentTitle">Agent</strong>
    <span id="agentStatus">connecting…</span>
  </div>
  <div id="agentStream"></div>
  <script type="module" src="/agent-view.js"></script>
</body>
</html>
